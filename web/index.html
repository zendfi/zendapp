<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <!-- "default" lets iOS tint the bar to match the page; "black" forced a black bar. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!-- Status bar colour while Flutter loads, matching the page in each mode.
       Once Flutter draws, it writes its own theme-color (MaterialApp.color in
       app.dart, which follows the in-app theme toggle) and these are removed
       so they can't win over it. -->
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F2F1ED" media="(prefers-color-scheme: light)" data-boot-theme>
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" data-boot-theme>
  <style>
    html, body { background: #F2F1ED; }
    @media (prefers-color-scheme: dark) { html, body { background: #000000; } }
  </style>
  <!-- A file, not inline: the CSP in vercel.json only allows same-origin scripts. -->
  <script src="zend_boot_theme.js"></script>
  <meta name="apple-mobile-web-app-title" content="Zend">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- What share previews show. Money links (/z, /a, /cash) get their own from
       api/link-preview.js, which replaces everything between these markers. -->
  <!-- link-preview -->
  <title>Zend</title>
  <meta name="description" content="The internet's social money network. Send money to anyone, anywhere.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Zend">
  <meta property="og:url" content="https://app.usezend.app/">
  <meta property="og:title" content="Zend">
  <meta property="og:description" content="The internet's social money network. Send money to anyone, anywhere.">
  <meta property="og:image" content="https://app.usezend.app/icons/Icon-512.png">
  <meta name="twitter:card" content="summary">
  <!-- /link-preview -->
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- QR decoding on web (mobile_scanner + upload). Self-hosted, pinned
       @zxing/library 0.21.3; the id makes mobile_scanner skip its unpkg load. -->
  <script id="mobile-scanner-barcode-reader" src="zxing-0.21.3.min.js" defer></script>
  <!-- Offline cache: opens the app with no signal. See zend_sw.js. -->
  <script src="zend_sw_register.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
