name: ziro_vision
description: >-
  Ziro palm-scan capture for Zend: camera, hand landmarks, quality gate, palm
  crop, on-device templates, flash capture for liveness, hardware device key and
  per-charge integrity. Raw camera frames never leave native code.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.1
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.zend.ziro_vision
        pluginClass: ZiroVisionPlugin
      ios:
        pluginClass: ZiroVisionPlugin
  # Model files are dropped into this folder (see README "Model assets").
  # The folder ships with only MODELS.md so the declaration never fails.
  assets:
    - assets/models/
