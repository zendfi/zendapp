name: Deploy Web (app.usezend.app)

# main → production (app.usezend.app). Other branches and PRs → a Vercel
# preview URL, posted on the PR, so web changes can be checked before merge.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Flutter Web → Vercel
    runs-on: ubuntu-latest
    # Fork PRs don't get secrets; skip instead of failing.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      IS_PROD: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.3"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # --wasm is deliberately NOT used. It selects the skwasm renderer on
      # WasmGC browsers, and skwasm was trapping with "memory access out of
      # bounds" inside skwasm.wasm. A Wasm trap is not recoverable: the renderer
      # stops producing frames and the whole app freezes with no Dart exception
      # to catch, so there is nothing the app can do about it. Dropping --wasm
      # builds dart2js + CanvasKit instead, which is the path mobile Chrome was
      # already loading (it has no WasmGC, so it took main.dart.js) and the only
      # configuration that has completed a sign-in end to end.
      #
      # It also removes a second class of problem: dart2wasm has no dart:html,
      # which is how dio 5.4 broke every request in the wasm bundle while the
      # JS bundle was fine. One compiler means one behaviour to reason about.
      #
      # Nothing depends on dart2wasm. The js_interop call sites all use
      # package:web, which compiles under both.
      #
      # --no-web-resources-cdn self-hosts the renderer, which keeps CanvasKit
      # off gstatic and out of the CSP.
      #
      # That is no longer the whole story: the CSP in vercel.json also allows
      # https://accounts.google.com/gsi/*, because google_sign_in_web injects
      # the Google Identity Services script at bootstrap. It arrives via the
      # google_sign_in dependency, which this app uses for Google Drive (salt
      # share B and cloud backup) rather than for zkLogin sign-in — that runs
      # on flutter_web_auth_2 and a plain OAuth redirect. Self-hosting the
      # renderer does not remove that origin.
      #
      # --pwa-strategy=none disables Flutter's service worker. It was actively
      # harmful here: a service worker serves navigations from the Cache API,
      # and a cached response carries the headers it was stored with — so a
      # client that had the old CSP kept getting the old CSP no matter how many
      # times this deployed, reporting a policy the server had stopped sending.
      # index.html is already Cache-Control: no-store, which the service worker
      # ignores entirely.
      #
      # It also caused Safari to hang on load: a cached index.html referencing
      # hashed build artifacts from a previous deploy waits forever on files
      # that now 404, which presents as an endless spinner rather than an error.
      #
      # Nothing is lost. A wallet needs the API for every meaningful action, so
      # there was no offline capability to preserve, and Flutter's own build
      # output notes this service worker is deprecated and due for removal.
      - name: Build web
        run: flutter build web --release --no-web-resources-cdn --pwa-strategy=none --dart-define=GIPHY_API_KEY=${{ secrets.GIPHY_API_KEY_WEB }} --dart-define=ZLINK_PACKAGE_ID=0xc75d61e531530a63e68aaf23dc360d2587dc902a5f5fc25e725e53a37f135296 --dart-define=PRIZE_PACKAGE_ID=0x97a1fe540f5904405474c171ce96062f8f0cac9c2538b05d8c76e9900adf3ff7

      # build/web is uploaded as the deployment root, so vercel.json goes in
      # it — minus outputDirectory, which only makes sense from the repo root.
      - name: Add hosting config
        run: jq 'del(.outputDirectory)' vercel.json > build/web/vercel.json

      - name: Deploy to Vercel
        id: deploy
        working-directory: build/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ "$IS_PROD" = "true" ]; then PROD_FLAG="--prod"; else PROD_FLAG=""; fi
          url=$(npx --yes vercel@65.2.0 deploy $PROD_FLAG --yes --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `**Web preview:** ${{ steps.deploy.outputs.url }}\n\nGoogle sign-in only works on origins registered on the OAuth client, so test zkLogin on app.usezend.app after merge.`
            });
