name: zendapp
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Networking
  dio: 5.4.3+1

  # WebSocket client for pool real-time messaging
  web_socket_channel: ^2.4.0

  # Secure storage (iOS Keychain / Android Keystore)
  flutter_secure_storage: 9.2.4

  # Lightweight key-value persistence (QR style preference, etc.)
  shared_preferences: ^2.3.2

  # Biometric authentication (Face ID / fingerprint) for wallet unlock
  local_auth: ^2.3.0

  # BIP-39 mnemonic derivation from wallet seed
  bip39: ^1.0.6

  # Solana keypair generation, transaction building, base58
  solana: 0.31.0+1

  # AES-256-GCM encryption + PBKDF2 key derivation
  cryptography: 2.7.0

  # Argon2id key derivation — pure Dart via pointycastle (no native CMake build needed).
  # pointycastle is already a transitive dependency of solana; declaring it direct
  # pins the version and enables the Argon2BytesGenerator / Argon2Parameters API.
  pointycastle: ^3.9.1

  # Google Sign-In for Drive API access (Android recovery backup).
  # NOT usable for zkLogin: the plugin cannot set an OIDC `nonce`, and zkLogin
  # requires the nonce to be embedded in the ID token. See flutter#85439. The
  # zkLogin flow uses flutter_web_auth_2 below instead.
  google_sign_in: ^6.2.1

  # Browser-based OpenID Connect round-trip for zkLogin sign-in. Uses Custom Tabs
  # on Android and ASWebAuthenticationSession on iOS, which is what Google
  # supports (embedded webviews are refused). Chosen over flutter_appauth because
  # zkLogin needs only an ID token — no access or refresh tokens — so the token
  # endpoint and client secret are avoidable entirely for the implicit flow.
  flutter_web_auth_2: ^5.1.0

  # Google APIs — Drive v3 scope for recovery packet storage
  googleapis: ^13.0.0

  # HTTP client used by googleapis (declared explicitly to satisfy linter)
  http: ^1.2.0

  # Hex / byte encoding for recovery packet fields
  convert: ^3.1.1

  # Audio — success sound on transfer
  audioplayers: ^6.1.0

  # Voice note recording — temporarily disabled pending AGP 8 compatible package.
  # record 4.x: missing namespace in android/build.gradle (AGP 8 incompatible).
  # record 5.x: broken record_linux platform interface.
  # Re-enable when a compatible recorder package is available.
  # record: ^4.4.4

  # Voice note playback
  just_audio: ^0.9.40

  # Microphone / audio permission requests (handled by record 4.x internally)
  # permission_handler: ^11.3.1  # removed — record 4.x calls hasPermission() natively

  # Deep link / URL launch
  url_launcher: ^6.3.1

  # QR code generation
  qr_flutter: ^4.1.0

  # Native share sheet (WhatsApp, X, Telegram, etc.)
  share_plus: ^10.1.4

  # Device contacts access — used to find which contacts are on Zend
  flutter_contacts: ^1.1.9+2

  # QR/barcode scanning via camera
  mobile_scanner: ^6.0.0

  # Save images to device gallery (iOS + Android)
  gal: ^2.3.0

  # NFC tag reading and writing
  nfc_manager: ^3.3.0

  # BLE scanning and advertising for Zend Drop proximity transfers
  flutter_blue_plus: 1.35.3

  # Network image caching (profile photos)
  cached_network_image: ^3.4.1

  # Direct dependency on cached_network_image's underlying cache manager —
  # used to download+cache push-notification sender avatars for the
  # Android largeIcon / iOS attachment (see push_notification_service.dart).
  # Previously only pulled in transitively via cached_network_image.
  flutter_cache_manager: ^3.4.1

  # Camera / gallery access (avatar upload)
  image_picker: ^1.1.2

  # Firebase — push notifications
  firebase_core: ^3.13.1
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^18.0.1

  # Local SQLite persistence via drift
  drift: ^2.18.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # Direct SQLite access (no code generation required)
  sqflite: ^2.3.0

  # UUID generation for client-side message IDs
  uuid: ^4.4.0

  # Phosphor Icons — Bold/Fill style icon set, replaces solar_icons for far
  # broader icon coverage (avoids the "closest available" compromises solar_icons
  # forced in a handful of screens).
  phosphor_flutter: ^2.1.0

  # Keeps the native (pre-Flutter-engine) splash screen on-screen through
  # session restore via FlutterNativeSplash.preserve()/.remove() in
  # main.dart/app.dart — moved out of dev_dependencies since it's now called
  # at runtime, not just as a build-time asset generator.
  flutter_native_splash: ^2.4.7
  scrollable_positioned_list: ^0.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  drift_dev: ^2.18.0
  build_runner: ^2.4.0

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  assets:
    - assets/logo/Zend.png
    - assets/logo/Zend-splash.png
    - assets/icons/zend-icon-navbar.png
    - assets/sounds/
    - assets/countries/
    - assets/countries/flags/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

  fonts:
    # CircularStd is the single sans family: Book/Medium for body & UI,
    # Bold/Black for display & headline styles. No italics by design —
    # Circular Std has no Light cut, so the Book asset is registered
    # twice (300 and 400) to give FontWeight.w300 requests a deterministic,
    # non-synthesized match instead of falling back to Skia's nearest-weight
    # matching.
    - family: CircularStd
      fonts:
        - asset: assets/fonts/circular/CircularStd-Book.otf
          weight: 300
        - asset: assets/fonts/circular/CircularStd-Book.otf
          weight: 400
        - asset: assets/fonts/circular/CircularStd-Medium.otf
          weight: 500
        - asset: assets/fonts/circular/CircularStd-Bold.otf
          weight: 700
        - asset: assets/fonts/circular/CircularStd-Black.otf
          weight: 900
  # DMMono block removed

flutter_launcher_icons:
  android: true
  ios: true
  # Zend.png has an alpha channel — Apple's App Store rejects iOS icons with
  # transparency, so flag removal here rather than shipping a flattened PNG
  # as the source asset.
  remove_alpha_ios: true
  image_path: "assets/logo/Zend.png"
  web:
    generate: true
    image_path: "assets/logo/Zend.png"

# Native (pre-Flutter-engine) splash screen — shown by the OS the instant
# the app process starts, before Flutter has loaded enough to paint the
# Dart SplashScreen widget. Without this, Android falls back to a plain
# white (light mode) or solid black (dark mode, via Theme.Black) window
# background with no logo — that blank window is the "black screen for a
# few seconds" on startup. Background colors intentionally use the app's
# own light/dark surface colors (ZendTheme bgPrimary — #FAFAF7 / #0D0D0D),
# not the brand deep-green (ZendColors.bgDeep), so the dark-green logo
# always has contrast to pop against instead of nearly disappearing into a
# same-hued green backdrop.
#
# Uses Zend-splash.png (a padded/centered version of the icon), NOT the raw
# Zend.png — the raw icon fills ~98% of its canvas edge-to-edge (that's
# correct for an app icon, which is itself masked/inset by the OS), so
# using it directly as the splash image renders a logo that fills the
# entire screen. Zend-splash.png centers the same logo on a much larger
# transparent canvas so it renders at roughly the same visual size as the
# logo in the Dart SplashScreen widget, avoiding a visible size jump
# between the native splash and the Dart splash that follows it.
flutter_native_splash:
  color: "#FAFAF7"
  color_dark: "#0D0D0D"
  image: assets/logo/Zend-splash.png
  image_dark: assets/logo/Zend-splash.png
  android_12:
    color: "#FAFAF7"
    color_dark: "#0D0D0D"
    image: assets/logo/Zend-splash.png
    image_dark: assets/logo/Zend-splash.png
  android: true
  ios: true
  web: false
